<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sallen-Key Lowpass Filter</title>
<style>
  :root {
    --bg: #171a26;
    --panel: #1e2235;
    --border: #2a3048;
    --accent: #00e5ff;
    --text: #e0e6f0;
    --text-dim: #8a94a8;
    --success: #69f0ae;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 12px;
    -webkit-tap-highlight-color: transparent;
  }
  .dashboard {
    width: 100%;
    max-width: 960px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  header { text-align: center; }
  header h1 {
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--accent);
    text-transform: uppercase;
  }
  header p { font-size: 0.8rem; color: var(--text-dim); margin-top: 4px; }
  .curve-panel {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  #bodeCanvas {
    display: block;
    width: 100%;
    height: 220px;
    background: linear-gradient(180deg, #1a1e30 0%, #141722 100%);
  }
  .play-toggle {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: rgba(23,26,38,0.95);
    color: var(--accent);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    -webkit-appearance: none;
    font-size: 0;
  }
  .play-toggle:active { background: var(--accent); color: #000; }
  .play-toggle:disabled { opacity: 0.4; }
  .play-toggle svg { width: 22px; height: 22px; pointer-events: none; }
  .status-badge {
    position: absolute;
    bottom: 10px;
    left: 10px;
    font-size: 0.7rem;
    font-weight: 500;
    padding: 5px 10px;
    border: 1px dashed var(--text-dim);
