<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2nd-Order Sallen-Key Digital Lowpass Filter</title>
<style>
  :root {
    --bg: #171a26;
    --panel: #1e2235;
    --border: #2a3048;
    --accent: #00e5ff;
    --text: #e0e6f0;
    --text-dim: #8a94a8;
    --success: #69f0ae;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 12px;
    -webkit-tap-highlight-color: transparent;
  }
  .dashboard {
    width: 100%;
    max-width: 960px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  header { text-align: center; }
  header h1 {
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--accent);
    text-transform: uppercase;
  }
  header p {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .curve-panel {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  #bodeCanvas {
    display: block;
    width: 100%;
    height: 240px;
    background: linear-gradient(180deg, #1a1e30 0%, #141722 100%);
  }
  .play-toggle {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: rgba(23,26,38,0.9);
    color: var(--accent);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    -webkit-appearance: none;
  }
  .play-toggle:active { background: var(--accent); color: var(--bg); }
  .play-toggle:disabled { opacity: 0.35; }
  .play-toggle svg { width: 20px; height: 20px; pointer-events: none; }
  .status-badge {
    position: absolute;
    bottom: 10px;
    left: 10px;
    font-size: 0.7rem;
    font-weight: 500;
    padding: 5px 10px;
    border: 1px dashed var(--text-dim);
    border-radius: 6px;
    background: rgba(23,26,38,0.8);
    color: var(--text-dim);
    z-index: 10;
  }
  .status-badge.live {
    border-color: var(--success);
    color: var(--success);
  }
  .meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }
  @media (max-width: 600px) {
    .meta-grid { grid-template-columns: 1fr; }
  }
  .meta-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .meta-card .label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .meta-card .value {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--accent);
  }
  .meta-card .value.static {
    font-size: 0.9rem;
    color: var(--text);
    font-weight: 500;
  }
  .controls {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .upload-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .upload-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: transparent;
    border: 1px solid var(--accent);
    border-radius: 8px;
    color: var(--accent);
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    -webkit-appearance: none;
  }
  .upload-btn:active { background: var(--accent); color: var(--bg); }
  #fileInput { display: none; }
  .file-name {
    font-size: 0.8rem;
    color: var(--text-dim);
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .slider-section label {
    display: block;
    font-size: 0.85rem;
    color: var(--text);
    margin-bottom: 10px;
  }
  .slider-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid #fff;
    box-shadow: 0 0 8px rgba(0,229,255,0.5);
  }
  .freq-readout {
    min-width: 70px;
    text-align: right;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--accent);
  }
  footer {
    text-align: center;
    font-size: 0.7rem;
    color: var(--text-dim);
  }
</style>
</head>
<body>
  <div class="dashboard">
    <header>
      <h1>Sallen-Key Digital Lowpass</h1>
      <p>2nd-Order · Bilinear · Real-time</p>
    </header>

    <div class="curve-panel">
      <canvas id="bodeCanvas"></canvas>
      <button class="play-toggle" id="playBtn" disabled>
        <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="iconStop" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="6" width="12" height="12"/></svg>
      </button>
      <div class="status-badge" id="statusBadge">Audio Muted</div>
    </div>

    <div class="meta-grid">
      <div class="meta-card">
        <div class="label">Cutoff Freq</div>
        <div class="value" id="cutoffDisplay">250 Hz</div>
      </div>
      <div class="meta-card">
        <div class="label">Filter Configuration</div>
        <div class="value static">2nd-Order Sallen-Key LP (Q=0.707)</div>
      </div>
      <div class="meta-card">
        <div class="label">Audio Stream Status</div>
        <div class="value" id="streamStatus">No Track Loaded</div>
      </div>
    </div>

    <div class="controls">
      <div class="upload-row">
        <label class="upload-btn" for="fileInput">
          Upload Audio (.mp3 / .wav)
        </label>
        <input type="file" id="fileInput" accept="audio/*,.mp3,.wav">
        <span class="file-name" id="fileName">No file selected</span>
      </div>

      <div class="slider-section">
        <label for="cutoffSlider">Adjust Cutoff for Low-Frequency Extraction</label>
        <div class="slider-wrap">
          <input type="range" id="cutoffSlider" min="40" max="2000" value="250" step="1">
          <span class="freq-readout" id="sliderReadout">250 Hz</span>
        </div>
      </div>
    </div>

    <footer>Offline · Self-contained · Web Audio API</footer>
  </div>

<script>
(function () {
  'use strict';

  const Q = 0.707;
  const FMIN = 20, FMAX = 20000;
  const DB_MIN = -60, DB_MAX = 6;

  const canvas = document.getElementById('bodeCanvas');
  const ctx = canvas.getContext('2d');
  const playBtn = document.getElementById('playBtn');
  const iconPlay = document.getElementById('iconPlay');
  const iconStop = document.getElementById('iconStop');
  const statusBadge = document.getElementById('statusBadge');
  const cutoffDisplay = document.getElementById('cutoffDisplay');
  const streamStatus = document.getElementById('streamStatus');
  const fileInput = document.getElementById('fileInput');
  const fileName = document.getElementById('fileName');
  const cutoffSlider = document.getElementById('cutoffSlider');
  const sliderReadout = document.getElementById('sliderReadout');

  let audioCtx = null;
  let sourceNode = null;
  let filterNode = null;
  let gainNode = null;
  let audioBuffer = null;
  let isPlaying = false;
  let cutoffHz = 250;

  // RBJ bilinear lowpass coefficients
  function computeBiquadCoeffs(fc, fs, q) {
    const w0 = 2 * Math.PI * fc / fs;
    const cosw0 = Math.cos(w0);
    const sinw0 = Math.sin(w0);
    const alpha = sinw0 / (2 * q);
    const b0 = (1 - cosw0) / 2;
    const b1 = 1 - cosw0;
    const b2 = (1 - cosw0) / 2;
    const a0 = 1 + alpha;
    const a1 = -2 * cosw0;
    const a2 = 1 - alpha;
    return { b0: b0/a0, b1: b1/a0, b2: b2/a0, a1: a1/a0, a2: a2/a0 };
  }

  function magnitudeDb(f, c, fs) {
    const w = 2 * Math.PI * f / fs;
    const cosw = Math.cos(w), cos2w = Math.cos(2*w);
    const sinw = Math.sin(w), sin2w = Math.sin(2*w);
    const reN = c.b0 + c.b1*cosw + c.b2*cos2w;
    const imN = -c.b1*sinw - c.b2*sin2w;
    const reD = 1 + c.a1*cosw + c.a2*cos2w;
    const imD = -c.a1*sinw - c.a2*sin2w;
    const mag2 = (reN*reN + imN*imN) / (reD*reD + imD*imD);
    return 10 * Math.log10(Math.max(mag2, 1e-30));
  }

  function drawBode() {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth || 900;
    const h = canvas.clientHeight || 240;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const padL = 48, padR = 14, padT = 22, padB = 32;
    const plotW = w - padL - padR;
    const plotH = h - padT - padB;

    ctx.fillStyle = '#141722';
    ctx.fillRect(0, 0, w, h);

    ctx.strokeStyle = '#252a3d';
    ctx.lineWidth = 1;
    [20,50,100,200,500,1000,2000,5000,10000,20000].forEach(f => {
      if (f < FMIN || f > FMAX) return;
      const x = padL + plotW * (Math.log10(f) - Math.log10(FMIN)) / (Math.log10(FMAX) - Math.log10(FMIN));
      ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + plotH); ctx.stroke();
    });
    for (let db = DB_MIN; db <= DB_MAX; db += 12) {
      const y = padT + plotH * (1 - (db - DB_MIN) / (DB_MAX - DB_MIN));
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y); ctx.stroke();
    }

    ctx.fillStyle = '#6a7388';
    ctx.font = '10px system-ui,sans-serif';
    ctx.textAlign = 'center';
    [100,1000,10000].forEach(f => {
      const x = padL + plotW * (Math.log10(f) - Math.log10(FMIN)) / (Math.log10(FMAX) - Math.log10(FMIN));
      ctx.fillText(f >= 1000 ? (f/1000)+'k' : f, x, h - 12);
    });
    ctx.textAlign = 'right';
    for (let db = DB_MIN; db <= DB_MAX; db += 12) {
      const y = padT + plotH * (1 - (db - DB_MIN) / (DB_MAX - DB_MIN));
      ctx.fillText(db + '', padL - 4, y + 3);
    }

    const fs = (audioCtx && audioCtx.sampleRate) ? audioCtx.sampleRate : 44100;
    const coeffs = computeBiquadCoeffs(cutoffHz, fs, Q);

    ctx.beginPath();
    ctx.strokeStyle = '#00e5ff';
    ctx.lineWidth = 2;
    const steps = 400;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const f = Math.pow(10, Math.log10(FMIN) + t * (Math.log10(FMAX) - Math.log10(FMIN)));
      const db = magnitudeDb(f, coeffs, fs);
      const x = padL + plotW * t;
      const y = padT + plotH * (1 - (Math.max(DB_MIN, Math.min(DB_MAX, db)) - DB_MIN) / (DB_MAX - DB_MIN));
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    const tCut = (Math.log10(cutoffHz) - Math.log10(FMIN)) / (Math.log10(FMAX) - Math.log10(FMIN));
    const xCut = padL + plotW * tCut;
    const dbCut = magnitudeDb(cutoffHz, coeffs, fs);
    const yCut = padT + plotH * (1 - (Math.max(DB_MIN, Math.min(DB_MAX, dbCut)) - DB_MIN) / (DB_MAX - DB_MIN));

    ctx.strokeStyle = 'rgba(255,64,129,0.4)';
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(xCut, padT); ctx.lineTo(xCut, padT + plotH); ctx.stroke();
    ctx.setLineDash([]);

    ctx.beginPath();
    ctx.arc(xCut, yCut, 5, 0, Math.PI*2);
    ctx.fillStyle = '#ff4081';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  function ensureCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  // 简单增益补偿：截止越低，增益越高，让音色变化更明显
  function getMakeupGain(fc) {
    // 以 1000 Hz 为参考，截止越低补偿越多（最大约 +12 dB）
    const ref = 1000;
    const ratio = Math.max(0.15, Math.min(1, fc / ref));
    return 1 / Math.sqrt(ratio);   // 大约补偿能量损失
  }

  function createFilter() {
    const ctx = ensureCtx();
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = cutoffHz;
    f.Q.value = Q;
    return f;
  }

  function buildGraph() {
    if (!audioBuffer) return;
    const ctx = ensureCtx();

    if (sourceNode) { try { sourceNode.stop(); } catch(e){} try { sourceNode.disconnect(); } catch(e){} }
    if (filterNode) try { filterNode.disconnect(); } catch(e){}
    if (gainNode) try { gainNode.disconnect(); } catch(e){}

    sourceNode = ctx.createBufferSource();
    sourceNode.buffer = audioBuffer;
    sourceNode.loop = true;

    filterNode = createFilter();
    gainNode = ctx.createGain();
    gainNode.gain.value = getMakeupGain(cutoffHz) * 0.7;

    sourceNode.connect(filterNode);
    filterNode.connect(gainNode);
    gainNode.connect(ctx.destination);
  }

  function startPlayback() {
    if (!audioBuffer) return;
    ensureCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    buildGraph();
    sourceNode.start(0);
    isPlaying = true;

    iconPlay.style.display = 'none';
    iconStop.style.display = 'block';
    statusBadge.textContent = 'Filtering Live Output';
    statusBadge.classList.add('live');
    streamStatus.textContent = 'Playing · Filtered';
  }

  function stopPlayback() {
    if (sourceNode) {
      try { sourceNode.stop(); } catch(e){}
      try { sourceNode.disconnect(); } catch(e){}
      sourceNode = null;
    }
    isPlaying = false;
    iconPlay.style.display = 'block';
    iconStop.style.display = 'none';
    statusBadge.textContent = 'Audio Muted';
    statusBadge.classList.remove('live');
    streamStatus.textContent = audioBuffer ? 'Ready · Paused' : 'No Track Loaded';
  }

  function formatFreq(hz) {
    return hz >= 1000 ? (hz/1000).toFixed(hz >= 10000 ? 1 : 2) + ' kHz' : Math.round(hz) + ' Hz';
  }

  function updateCutoff(val) {
    cutoffHz = +val;
    cutoffDisplay.textContent = formatFreq(cutoffHz);
    sliderReadout.textContent = formatFreq(cutoffHz);

    if (filterNode && audioCtx) {
      const now = audioCtx.currentTime;
      filterNode.frequency.setTargetAtTime(cutoffHz, now, 0.015);
      filterNode.Q.setTargetAtTime(Q, now, 0.015);
    }
    if (gainNode && audioCtx) {
      gainNode.gain.setTargetAtTime(getMakeupGain(cutoffHz) * 0.7, audioCtx.currentTime, 0.03);
    }
    drawBode();
  }

  cutoffSlider.addEventListener('input', e => updateCutoff(e.target.value));

  playBtn.addEventListener('click', () => {
    if (!audioBuffer) return;
    isPlaying ? stopPlayback() : startPlayback();
  });

  fileInput.addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    fileName.textContent = file.name;
    streamStatus.textContent = 'Decoding…';
    playBtn.disabled = true;
    stopPlayback();

    try {
      const arrayBuf = await file.arrayBuffer();
      ensureCtx();
      audioBuffer = await audioCtx.decodeAudioData(arrayBuf.slice(0));
      streamStatus.textContent = 'Ready · Paused';
      playBtn.disabled = false;
      drawBode();
    } catch (err) {
      console.error(err);
      streamStatus.textContent = 'Decode Error';
      fileName.textContent = 'Failed';
      audioBuffer = null;
      playBtn.disabled = true;
    }
  });

  window.addEventListener('resize', drawBode);
  updateCutoff(250);
  drawBode();
})();
</script>
</body>
</html>
